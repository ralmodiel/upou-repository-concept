name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read } # least privilege: the build job can only read the repo
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --ignore-scripts && node scripts/deps.mjs # npm ci fails on a lockfile out of sync; no install scripts run; no secrets in this step
        working-directory: web
      - run: |
          test -n "$ADV_USER" || { echo "::error::Repository secret ADV_USER is empty or missing (Settings > Secrets and variables > Actions; see docs/access.md)"; exit 1; }
          test -n "$ADV_PASS" || { echo "::error::Repository secret ADV_PASS is empty or missing (Settings > Secrets and variables > Actions; see docs/access.md)"; exit 1; }
          npm run build && node scripts/headers.mjs && node scripts/bundle.mjs
        working-directory: web
        env: { SITE_URL: "${{ vars.SITE_URL }}", ADV_USER: "${{ secrets.ADV_USER }}", ADV_PASS: "${{ secrets.ADV_PASS }}" } # the two secrets exist only in this step (the build encrypts the adviser data); never echoed, no set -x. SITE_URL: repository variable; unset = placeholder URLs
      - run: npm sbom --sbom-format cyclonedx > dist/sbom.cdx.json && node scripts/supply.mjs dist/sbom.cdx.json # CycloneDX SBOM shipped with the site
        working-directory: web
      - uses: actions/upload-pages-artifact@v5
        with: { path: web/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - id: d
        uses: actions/deploy-pages@v5
